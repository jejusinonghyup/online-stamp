<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fa5">
<title>미션 스탬프 · 2026 AX농업포럼 X 제주시농협</title>
<style>
:root{--blue:#0b5fa5;--blue-d:#084a82;--green:#6fae1f;--ink:#1c2733;--mute:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--ok:#15803d;--bad:#b91c1c;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.app-root{max-width:480px;margin:0 auto;padding-bottom:40px;background:var(--bg)}
body.single .app-root{min-height:100vh}
header{background:linear-gradient(90deg,var(--blue) 0 70%,var(--green) 100%);color:#fff;padding:18px 20px 16px}
header small{opacity:.85;font-size:12px;letter-spacing:.02em}
header h1{margin:2px 0 0;font-size:20px;font-weight:800}
.demo{background:#fff7d6;color:#7a5b00;font-size:12px;padding:6px 20px;border-bottom:1px solid #f1e3a2}
main{padding:16px 16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--mute)}
.center{text-align:center;padding:40px 0}
h2{font-size:16px;margin:0 0 4px}
p{margin:0 0 8px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
input[type=text],input[type=email],input[type=password],input[type=tel]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid #cbd5e1;border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,95,165,.15)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;width:100%}
button:active{background:var(--blue-d)}
button.sec{background:#e8eef6;color:var(--blue)}
button.ghost{background:transparent;color:var(--mute);width:auto;padding:6px 10px;font-size:13px;font-weight:600}
button:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.noti{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.noti b{font-size:18px}
.prog{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s}
.slot{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px dashed #cbd5e1;border-radius:16px;background:#fff;margin-bottom:10px}
.slot.done{border:1.5px solid var(--green);background:#f3faea}
.stamp{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:#eef2f7;filter:grayscale(1);opacity:.6}
.slot.done .stamp{background:#fff;filter:none;opacity:1;border:3px solid var(--green);transform:rotate(-8deg)}
.slot .t{flex:1;min-width:0}
.slot .t b{display:block;font-size:15px}
.slot .t span{display:block;font-size:12.5px;color:var(--mute);line-height:1.4}
.slot .t a{display:inline-block;margin-top:3px;font-size:13px;color:var(--blue);font-weight:700}
.slot button{width:auto;padding:10px 12px;font-size:14px;flex:none}
.badge{font-size:13px;font-weight:800;color:var(--ok);flex:none}
.win{background:linear-gradient(135deg,#0b5fa5,#2f8f3a);color:#fff;border:0;text-align:center}
.win .no{font-size:38px;font-weight:900;letter-spacing:.12em;margin:6px 0;font-variant-numeric:tabular-nums}
.win.claimed{background:#475569}
.banner{background:#fff7d6;border:1px solid #f1e3a2;color:#7a5b00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.bad{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.keep{background:#f0f7ff;border-color:#cfe3f7}
.rec{font-size:28px;font-weight:900;letter-spacing:.14em;text-align:center;color:var(--blue);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px 24px}
.code-in{font-size:30px!important;text-align:center;letter-spacing:.35em;font-weight:800}
.row{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:#e8eef6;color:var(--blue);padding:10px 4px;font-size:13px}
.tabs button.on{background:var(--blue);color:#fff}
.chips{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.chip{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;display:flex;gap:10px;align-items:center;font-size:15px;padding:11px 14px}
.chip.on{border-color:var(--blue);background:#eaf3fc;color:var(--blue-d)}
.bigcode{font-size:64px;font-weight:900;letter-spacing:.12em;text-align:center;color:var(--blue);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:100%;transition:width .25s linear}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--mute)}
.mini{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:14px;padding:6px 0}

</style>
</head>
<body>
<div class="app-root" id="app"></div>
<script type="module">
/* ============================================================
   설정 — index.html 에서는 이 블록만 고치면 됩니다
   firebase : Firebase 콘솔의 웹 앱 설정 객체. null 이면 데모 모드(이 브라우저에서만 동작)
   forum    : 스탬프를 찍을 수 있는 기간(한국시간). end 는 '이 시각 직전까지'
   shopUrl  : 미션5(온라인쇼핑몰 알림설정)에서 열어 줄 스토어 주소
   ============================================================ */
const CONFIG = {
  firebase: null,
  /* 예) firebase: { apiKey:"…", authDomain:"…", projectId:"…", appId:"…" }, */
  eventTitle: "2026 AX농업포럼 X 제주시농협",
  forum: { start: "2026-11-19T00:00:00+09:00", end: "2026-11-21T00:00:00+09:00", label: "11/19(목) ~ 11/20(금)" },
  codeTtlSec: 25,
  prize: "기념품",
  shopUrl: "https://smart.naver.com/jejusinh",
  booths: [
    { id: "b1", emoji: "⏱️", name: "5.0초를 잡아라", sub: "스톱워치 5.0초 맞추기에 성공하세요" },
    { id: "b2", emoji: "📦", name: "농산물 탑쌓기 ‘농탑’", sub: "농탑 미션에 성공하세요" },
    { id: "b3", emoji: "🌟", name: "황금 농산물을 잡아라 ‘골든픽’", sub: "골든픽 미션에 성공하세요" },
    { id: "b4", emoji: "📸", name: "미션 네컷", sub: "AI 점수 A등급 이상을 받으세요" },
    { id: "b5", emoji: "🔔", name: "온라인쇼핑몰 알림설정", sub: "제주시농협 온라인 스토어에서 알림을 설정하고 화면을 직원에게 보여 주세요", link: true },
  ],
};
const FB_VER = "10.12.2";
const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

/* ---------- 유틸 ---------- */
const BOOTH_IDS = CONFIG.booths.map(b => b.id);
const boothOf = id => CONFIG.booths.find(b => b.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (min, max) => min + (crypto.getRandomValues(new Uint32Array(1))[0] % (max - min + 1));
const newCode = () => Array.from({ length: 8 }, () => ALPHABET[rnd(0, ALPHABET.length - 1)]).join("");
const normCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const validCode = c => typeof c === "string" && /^[A-Z2-9]{8}$/.test(c);
const fmtCode = c => c.slice(0, 4) + "-" + c.slice(4);
const kst = ms => new Date(ms).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const kstTime = ms => new Date(ms).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit" });
const FORUM_WIN = () => ({ start: Date.parse(CONFIG.forum.start), end: Date.parse(CONFIG.forum.end) });
const OPEN_WIN = () => ({ start: Date.parse("2000-01-01T00:00:00Z"), end: Date.parse("2100-01-01T00:00:00Z") });
const winState = (w, now = Date.now()) => now < w.start ? "before" : now >= w.end ? "after" : "open";

function computeStats(cards, stamps) {
  // 이름이 '테스트'로 시작하는 카드는 리허설용으로 보고 집계에서 뺀다
  const list = cards.filter(c => !/^테스트/.test(c.name || ""));
  const ok = new Set(list.map(c => c.code));
  const per = {}; BOOTH_IDS.forEach(b => per[b] = 0);
  const by = {};
  stamps.forEach(s => { if (!ok.has(s.code) || per[s.booth] === undefined) return; per[s.booth]++; (by[s.code] ||= new Set()).add(s.booth); });
  const done = list.filter(c => (by[c.code]?.size || 0) >= BOOTH_IDS.length);
  return { total: list.length, per, done: done.length, claimed: list.filter(c => c.claimed).length };
}

/* ============================================================
   저장소 1) 데모/샘플용 (localStorage 또는 메모리)
   ============================================================ */
const blankDb = () => ({ c: {}, s: {}, k: {}, win: OPEN_WIN() });
function makeLocalBackend(key = "stamp_demo_v2") {
  return { load() { try { return JSON.parse(localStorage.getItem(key)) || blankDb(); } catch { return blankDb(); } }, save(d) { localStorage.setItem(key, JSON.stringify(d)); }, reset() { localStorage.removeItem(key); } };
}
function makeMemoryBackend() {
  let s = JSON.stringify(blankDb());
  return { load: () => JSON.parse(s), save: d => { s = JSON.stringify(d); }, reset() { s = JSON.stringify(blankDb()); } };
}
function makeDemoApi(backend) {
  const subs = new Set(); const notify = () => subs.forEach(f => f());
  addEventListener("storage", notify); setInterval(notify, 800);
  const load = () => backend.load(); const save = d => { backend.save(d); notify(); };
  const watch = (compute, cb) => { let last = ""; const f = () => { const v = compute(); const j = JSON.stringify(v); if (j !== last) { last = j; cb(v); } }; subs.add(f); f(); return () => subs.delete(f); };
  const stampsOf = (d, code) => { const o = {}; BOOTH_IDS.forEach(b => { const s = d.s[code + ":" + b]; if (s) o[b] = s.at; }); return o; };
  const cardOf = (d, code) => d.c[code] ? { code, ...d.c[code] } : null;
  return {
    demo: true, backend,
    p: {
      async create(name, org) {
        const d = load(); let code; do { code = newCode(); } while (d.c[code]);
        d.c[code] = { name, org, claimed: false, createdAt: Date.now() }; save(d); return { code };
      },
      async load(code) { return cardOf(load(), code); },
      async getWindow() { return load().win; },
      subscribe(code, cb) { return watch(() => { const d = load(); const card = cardOf(d, code); return card ? { card, stamps: stampsOf(d, code) } : null; }, v => v && cb(v)); },
      async stamp(code, booth, input) {
        const d = load(); if (!d.c[code]) throw new Error("nocard");
        if (winState(d.win) !== "open") throw new Error("closed");
        const k = d.k[booth]; if (!k || k.code !== input || Date.now() > k.expiresAt) throw new Error("invalid");
        if (d.s[code + ":" + booth]) throw new Error("dup");
        d.s[code + ":" + booth] = { at: Date.now() }; save(d);
      },
    },
    s: {
      async isStaff() { return true; }, async login() {}, async logout() {},
      async getWindow() { return { ...load().win, missing: false }; },
      async setWindow(w) { const d = load(); d.win = { start: w.start, end: w.end }; save(d); },
      async issueCode(booth) {
        const d = load(); const code = String(rnd(100000, 999999));
        d.k[booth] = { code, expiresAt: Date.now() + CONFIG.codeTtlSec * 1000 }; save(d);
        return { code, expiresAtMs: d.k[booth].expiresAt };
      },
      async lookup(q) {
        const d = load(); const n = normCode(q); const t = String(q).trim();
        const hit = validCode(n) && d.c[n] ? [n] : Object.keys(d.c).filter(c => d.c[c].name.startsWith(t));
        return hit.map(c => ({ ...cardOf(d, c), stamps: stampsOf(d, c) }));
      },
      async markClaimed(code) {
        const d = load(); if (!d.c[code] || !BOOTH_IDS.every(b => d.s[code + ":" + b])) throw new Error("incomplete");
        d.c[code].claimed = true; save(d);
      },
      subscribeStats(cb) {
        return watch(() => {
          const d = load();
          const cards = Object.keys(d.c).map(c => ({ code: c, name: d.c[c].name, claimed: d.c[c].claimed }));
          const stamps = Object.keys(d.s).map(k => { const [code, booth] = k.split(":"); return { code, booth }; });
          return computeStats(cards, stamps);
        }, cb);
      },
    },
  };
}

/* ============================================================
   저장소 2) Firebase (Auth + Firestore)
   ============================================================ */
async function makeFirebaseApi(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const fbApp = initializeApp(cfg); const auth = A.getAuth(fbApp); const db = F.getFirestore(fbApp);
  let user = await new Promise(res => { const un = A.onAuthStateChanged(auth, u => { un(); res(u); }); });
  let offset = 0;
  const ensure = async () => { if (!user) user = (await A.signInAnonymously(auth)).user; return user; };
  async function calibrate() {
    const ref = F.doc(db, "codes", "_ping"); const t0 = Date.now();
    await F.setDoc(ref, { t: F.serverTimestamp() }); const s = await F.getDoc(ref);
    offset = s.data().t.toMillis() - (t0 + Date.now()) / 2;
  }
  const stampMap = snap => { const o = {}; snap.forEach(d => o[d.id] = d.data().at?.toMillis?.() || Date.now()); return o; };
  const cardData = (id, data) => ({ code: id, name: data.name, org: data.org || "", claimed: !!data.claimed });
  const readWindow = async () => {
    const s = await F.getDoc(F.doc(db, "settings", "event"));
    if (!s.exists()) return { ...FORUM_WIN(), missing: true };
    return { start: s.data().start.toMillis(), end: s.data().end.toMillis(), missing: false };
  };
  return {
    demo: false,
    p: {
      async create(name, org) {
        await ensure();
        for (let i = 0; i < 6; i++) {
          const code = newCode();
          try { await F.setDoc(F.doc(db, "cards", code), { name, org, claimed: false, createdAt: F.serverTimestamp() }); return { code }; }
          catch (e) { if (e.code !== "permission-denied") throw e; }
        }
        throw new Error("create-failed");
      },
      async load(code) { await ensure(); const s = await F.getDoc(F.doc(db, "cards", code)); return s.exists() ? cardData(code, s.data()) : null; },
      async getWindow() { await ensure(); return readWindow(); },
      subscribe(code, cb) {
        let card = null, st = {}; const emit = () => { if (card) cb({ card, stamps: st }); };
        const u1 = F.onSnapshot(F.doc(db, "cards", code), s => { card = s.exists() ? cardData(code, s.data()) : null; emit(); });
        const u2 = F.onSnapshot(F.collection(db, "cards", code, "stamps"), s => { st = stampMap(s); emit(); });
        return () => { u1(); u2(); };
      },
      async stamp(code, booth, input) {
        await ensure();
        try { await F.setDoc(F.doc(db, "cards", code, "stamps", booth), { code: input, at: F.serverTimestamp() }); }
        catch (e) { throw new Error(e.code === "permission-denied" ? "invalid" : "net"); }
      },
    },
    s: {
      async isStaff() {
        if (!user || user.isAnonymous) return false;
        const s = await F.getDoc(F.doc(db, "staff", user.uid)); if (!s.exists()) return false;
        await calibrate(); return true;
      },
      async login(email, pw) {
        user = (await A.signInWithEmailAndPassword(auth, email, pw)).user;
        if (!(await this.isStaff())) { await A.signOut(auth); user = null; throw new Error("not-staff"); }
      },
      async logout() { await A.signOut(auth); user = null; },
      getWindow: readWindow,
      async setWindow(w) { await F.setDoc(F.doc(db, "settings", "event"), { start: F.Timestamp.fromMillis(w.start), end: F.Timestamp.fromMillis(w.end) }); },
      async issueCode(booth) {
        const code = String(rnd(100000, 999999));
        await F.setDoc(F.doc(db, "codes", booth), { code, expiresAt: F.Timestamp.fromMillis(Date.now() + offset + CONFIG.codeTtlSec * 1000) });
        return { code, expiresAtMs: Date.now() + CONFIG.codeTtlSec * 1000 };
      },
      async lookup(q) {
        const n = normCode(q); const t = String(q).trim(); let docs;
        if (validCode(n)) { const s = await F.getDoc(F.doc(db, "cards", n)); docs = s.exists() ? [s] : []; }
        else docs = (await F.getDocs(F.query(F.collection(db, "cards"), F.where("name", ">=", t), F.where("name", "<=", t + ""), F.limit(20)))).docs;
        return Promise.all(docs.map(async d => ({ ...cardData(d.id, d.data()), stamps: stampMap(await F.getDocs(F.collection(db, "cards", d.id, "stamps"))) })));
      },
      async markClaimed(code) { await F.updateDoc(F.doc(db, "cards", code), { claimed: true }); },
      subscribeStats(cb) {
        let cards = [], stamps = []; const emit = () => cb(computeStats(cards, stamps));
        const u1 = F.onSnapshot(F.collection(db, "cards"), s => { cards = s.docs.map(d => cardData(d.id, d.data())); emit(); });
        const u2 = F.onSnapshot(F.collectionGroup(db, "stamps"), s => { stamps = s.docs.map(d => ({ code: d.ref.parent.parent.id, booth: d.id })); emit(); });
        return () => { u1(); u2(); };
      },
    },
  };
}

/* ============================================================
   '지워지지 않는' 내 카드 기억 장치
   스탬프 자체는 서버에 저장되고, 이 기기는 '내 카드 코드'만 기억한다.
   localStorage + 쿠키 + IndexedDB + 주소(#c=코드) 4중으로 기억하고,
   하나라도 남아 있으면 나머지를 자동으로 되살린다.
   ============================================================ */
function makePersist() {
  const KEY = "ax_stamp_card_v1";
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open("ax_stamp", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbGet = async () => { try { const db = await idb(); return await new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(KEY); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch { return null; } };
  const idbSet = async v => { try { const db = await idb(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); v == null ? t.objectStore("kv").delete(KEY) : t.objectStore("kv").put(v, KEY); t.oncomplete = res; t.onerror = res; }); } catch {} };
  const lsGet = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
  const lsSet = v => { try { v == null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, v); } catch {} };
  const ckGet = () => { try { const m = document.cookie.match(new RegExp("(?:^|; )" + KEY + "=([^;]+)")); return m ? m[1] : null; } catch { return null; } };
  const ckSet = v => { try { document.cookie = v == null ? `${KEY}=; max-age=0; path=/` : `${KEY}=${v}; max-age=31536000; path=/; SameSite=Lax`; } catch {} };
  const fromUrl = () => { const m = location.hash.match(/[#&]c=([A-Za-z0-9-]+)/); return m ? normCode(m[1]) : null; };
  return {
    async get() {
      const c = [fromUrl(), lsGet(), ckGet(), await idbGet()].map(normCode).find(validCode) || null;
      if (c) await this.set(c); return c;
    },
    async set(c) {
      lsSet(c); ckSet(c); await idbSet(c);
      try { if (!location.hash.startsWith("#staff")) history.replaceState(null, "", location.pathname + location.search + "#c=" + c); } catch {}
    },
    async clear() { lsSet(null); ckSet(null); await idbSet(null); },
  };
}
function makeMemoryPersist() { let v = null; return { async get() { return v; }, async set(c) { v = c; }, async clear() { v = null; } }; }

/* ============================================================
   화면 (한 화면 = createApp 한 번. 샘플 페이지에서는 두 번 띄운다)
   ============================================================ */
function createApp(root, { api, persist, notice = "", overlayHost = root }) {
  const unsubs = []; let codeTimer = null, staffTab = "code", staffBooth = "b1";
  const q = (s, r = root) => r.querySelector(s);
  function cleanup() { while (unsubs.length) { try { unsubs.pop()(); } catch {} } clearInterval(codeTimer); overlayHost.querySelectorAll(".overlay").forEach(o => o.remove()); }
  const shell = (inner, sub = "미션 스탬프") =>
    `<header><small>${esc(CONFIG.eventTitle)}</small><h1>${esc(sub)}</h1></header>` +
    (notice ? `<div class="demo">${notice}</div>` : api.demo ? `<div class="demo">데모 모드 — 이 브라우저에서만 동작합니다. 실서비스는 설정에 Firebase 키를 넣으세요.</div>` : "") +
    `<main>${inner}</main>`;
  const render = html => { root.innerHTML = html; };
  const fail = e => render(shell(`<div class="card"><h2>연결에 문제가 있어요</h2><p class="muted">네트워크를 확인하고 새로고침해 주세요. 받은 스탬프는 서버에 그대로 있어요.</p><p class="mini">${esc(e.message || e)}</p></div>`));

  /* ---------------- 참가자 ---------------- */
  async function participantView() {
    render(shell(`<div class="center muted">불러오는 중…</div>`));
    let code = null, card = null;
    try { code = await persist.get(); if (code) card = await api.p.load(code); } catch (e) { return fail(e); }
    if (!card) return renderJoin(code ? "저장된 카드를 찾지 못했어요. 새로 만들거나 복구 코드를 입력해 주세요." : "");
    await persist.set(code);
    let win = { ...FORUM_WIN() }; try { win = await api.p.getWindow(); } catch {}
    let last = null; const redraw = () => last && renderCard(code, last, win);
    unsubs.push(api.p.subscribe(code, d => { last = d; redraw(); }));
    const iv = setInterval(redraw, 30000); unsubs.push(() => clearInterval(iv));
  }

  function renderJoin(msg = "") {
    render(shell(`
      <div class="card"><h2>스탬프 카드 만들기</h2>
        <p class="muted">미션 5개를 모두 완료하면 ${esc(CONFIG.prize)}을 드려요. 순서는 상관없고, 포럼 기간(${esc(CONFIG.forum.label)}) 안에 완료하면 됩니다.</p>
        <form id="f"><label for="og">소속</label>
          <input id="og" type="text" maxlength="30" autocomplete="organization" placeholder="예) 제주시농협 / 농협대학교 ○○학과" required>
          <label for="nm" style="margin-top:10px">이름</label>
          <input id="nm" type="text" maxlength="20" autocomplete="name" placeholder="예) 홍길동" required>
          <div class="err" id="e">${esc(msg)}</div><button id="go" type="submit">시작하기</button></form></div>
      <div class="card"><details><summary>이미 카드가 있어요 (복구 코드로 불러오기)</summary>
        <form id="rf" style="margin-top:8px"><label for="rc">복구 코드 8자리</label>
          <input id="rc" type="text" maxlength="9" autocomplete="off" placeholder="ABCD-EFGH" style="text-transform:uppercase;letter-spacing:.12em">
          <div class="err" id="re"></div><button class="sec" type="submit">내 카드 불러오기</button></form></details></div>`));
    q("#f").onsubmit = async ev => {
      ev.preventDefault(); const name = q("#nm").value.trim(), org = q("#og").value.trim(); if (!name || !org) { q("#e").textContent = "소속과 이름을 모두 입력해 주세요."; return; } q("#go").disabled = true;
      try { const { code } = await api.p.create(name, org); await persist.set(code); participantView(); }
      catch (e) { q("#e").textContent = "카드를 만들지 못했어요. 다시 시도해 주세요."; q("#go").disabled = false; }
    };
    q("#rf").onsubmit = async ev => {
      ev.preventDefault(); const code = normCode(q("#rc").value);
      if (!validCode(code)) { q("#re").textContent = "8자리 코드를 입력해 주세요."; return; }
      try { const card = await api.p.load(code); if (!card) { q("#re").textContent = "해당 코드의 카드가 없어요. 코드를 다시 확인해 주세요."; return; } await persist.set(code); participantView(); }
      catch { q("#re").textContent = "불러오지 못했어요. 네트워크를 확인해 주세요."; }
    };
  }

  function renderCard(code, { card, stamps }, win) {
    const n = BOOTH_IDS.filter(b => stamps[b]).length, all = n === BOOTH_IDS.length, st = winState(win);
    const banner = st === "before" ? `<div class="banner">스탬프는 포럼 기간(${esc(CONFIG.forum.label)})에 찍을 수 있어요. 카드는 미리 만들어 두셔도 돼요.</div>`
      : st === "after" && !all ? `<div class="banner bad">포럼 기간이 끝났어요. 이미 받은 스탬프는 그대로 보관돼요.</div>` : "";
    const slots = CONFIG.booths.map((b, i) => stamps[b.id]
      ? `<div class="slot done"><div class="stamp">${b.emoji}</div><div class="t"><b>${i + 1}. ${esc(b.name)}</b><span>${kstTime(stamps[b.id])} 확인</span></div><span class="badge">완료</span></div>`
      : `<div class="slot"><div class="stamp">${b.emoji}</div><div class="t"><b>${i + 1}. ${esc(b.name)}</b><span>${esc(b.sub)}</span>${b.link ? `<a href="${esc(CONFIG.shopUrl)}" target="_blank" rel="noopener">온라인 스토어 열기 ›</a>` : ""}</div><button data-b="${b.id}">코드 입력</button></div>`).join("");
    const win_ = all ? `<div class="card win ${card.claimed ? "claimed" : ""}">
        <div>${card.claimed ? "수령 완료" : `5종 완료! 🎉 ${esc(CONFIG.prize)} 받으러 가요`}</div><div class="no">${fmtCode(code)}</div>
        <div>${card.claimed ? "기념품을 받아 가셨어요. 참여해 주셔서 감사합니다." : "수령 데스크에서 이 화면을 보여 주세요."}</div></div>` : "";
    render(shell(`
      <div class="noti"><div>${card.org ? `<span class="mini">${esc(card.org)}</span><br>` : ""}<b>${esc(card.name)}</b>님의 스탬프</div></div>
      ${banner}${win_}
      <div class="card"><div class="noti" style="margin:0"><b>${n} / ${BOOTH_IDS.length}</b><span class="mini">성공을 확인한 직원이 코드를 알려 드려요</span></div>
        <div class="prog"><i style="width:${n / BOOTH_IDS.length * 100}%"></i></div></div>
      ${slots}
      <div class="card keep"><h2>🔒 스탬프는 서버에 안전하게 저장돼요</h2>
        <p class="muted" style="font-size:13px">받은 스탬프는 지워지지 않아요. 브라우저 기록을 지우거나 폰을 바꿔도 아래 복구 코드로 그대로 불러올 수 있으니 화면을 캡처해 두세요.</p>
        <div class="rec">${fmtCode(code)}</div><button class="sec" id="cp">복구 링크 복사</button><div class="mini" id="cpm" style="margin-top:6px;text-align:center"></div></div>`));
    root.querySelectorAll("button[data-b]").forEach(btn => btn.onclick = () => openCodeSheet(code, boothOf(btn.dataset.b), win));
    q("#cp").onclick = async () => {
      const url = location.origin + location.pathname + "#c=" + code; let ok = false;
      try { await navigator.clipboard.writeText(url); ok = true; } catch {}
      q("#cpm").textContent = ok ? "복사했어요. 메모 앱 등에 붙여 두세요." : "복사하지 못했어요. 복구 코드를 캡처해 두세요.";
    };
  }

  function openCodeSheet(code, b, win) {
    overlayHost.querySelectorAll(".overlay").forEach(o => o.remove());
    const o = document.createElement("div"); o.className = "overlay";
    o.innerHTML = `<div class="sheet"><h2>${b.emoji} ${esc(b.name)}</h2>
      <p class="muted">성공을 확인한 직원이 화면에 띄운 6자리 코드를 입력하세요. 코드는 ${CONFIG.codeTtlSec}초만 유효해요.</p>
      <input class="code-in" id="cd" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      <div class="err" id="ce"></div>
      <div class="row"><button class="sec" id="cc">닫기</button><button id="ok">스탬프 찍기</button></div></div>`;
    overlayHost.appendChild(o);
    const inp = q("#cd", o); inp.focus();
    o.onclick = e => { if (e.target === o) o.remove(); }; q("#cc", o).onclick = () => o.remove();
    const msg = { dup: "이미 찍힌 스탬프예요.", net: "네트워크 오류예요. 다시 시도해 주세요.", closed: `포럼 기간(${CONFIG.forum.label})에만 스탬프를 찍을 수 있어요.`, nocard: "카드를 찾지 못했어요. 복구 코드로 다시 불러와 주세요." };
    const submit = async () => {
      const input = inp.value.replace(/\D/g, ""); if (input.length !== 6) { q("#ce", o).textContent = "6자리 숫자를 입력해 주세요."; return; }
      if (winState(win) !== "open") { q("#ce", o).textContent = msg.closed; return; }
      q("#ok", o).disabled = true;
      try { await api.p.stamp(code, b.id, input); o.remove(); }
      catch (e) { q("#ce", o).textContent = msg[e.message] || "코드가 맞지 않거나 만료됐어요. 직원에게 다시 요청해 주세요."; q("#ok", o).disabled = false; inp.select(); }
    };
    q("#ok", o).onclick = submit; inp.onkeydown = e => { if (e.key === "Enter") submit(); };
  }

  /* ---------------- 직원 ---------------- */
  async function staffView() {
    render(shell(`<div class="center muted">불러오는 중…</div>`, "직원 모드"));
    let ok = false; try { ok = await api.s.isStaff(); } catch (e) { return fail(e); }
    ok ? renderStaff() : renderStaffLogin();
  }
  function renderStaffLogin(msg = "") {
    render(shell(`<div class="card"><h2>직원 로그인</h2>
      <form id="f"><label for="em">이메일</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw" style="margin-top:10px">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="err" id="e">${esc(msg)}</div><button id="go" type="submit">로그인</button></form></div>`, "직원 모드"));
    q("#f").onsubmit = async ev => {
      ev.preventDefault(); q("#go").disabled = true;
      try { await api.s.login(q("#em").value.trim(), q("#pw").value); renderStaff(); }
      catch (e) { renderStaffLogin(e.message === "not-staff" ? "직원으로 등록되지 않은 계정이에요." : "이메일 또는 비밀번호를 확인해 주세요."); }
    };
  }
  function renderStaff() {
    cleanup();
    const tabs = [["code", "코드 발급"], ["desk", "수령 데스크"], ["stat", "현황"], ["set", "설정"]];
    render(shell(`<div class="tabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${staffTab === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <div id="pane"></div><div style="text-align:center;margin-top:16px"><button class="ghost" id="lo">로그아웃</button></div>`, "직원 모드"));
    root.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { staffTab = b.dataset.t; renderStaff(); });
    q("#lo").onclick = async () => { await api.s.logout(); renderStaffLogin(); };
    ({ code: paneCode, desk: paneDesk, stat: paneStat, set: paneSet })[staffTab](q("#pane"));
  }

  function paneCode(p) {
    p.innerHTML = `<div class="card"><h2>미션 성공 확인 후 코드 발급</h2>
      <p class="muted">내가 맡은 부스를 고르고, 참가자가 미션에 성공했을 때만 버튼을 누르세요. 화면의 코드를 참가자에게 보여 주면 됩니다.</p>
      <div class="chips">${CONFIG.booths.map((b, i) => `<button class="chip ${staffBooth === b.id ? "on" : ""}" data-b="${b.id}"><span>${b.emoji}</span><span>${i + 1}. ${esc(b.name)}</span></button>`).join("")}</div>
      <button id="issue">성공 확인 · 코드 발급</button><div id="out" style="margin-top:14px"></div></div>`;
    p.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { staffBooth = b.dataset.b; clearInterval(codeTimer); paneCode(p); });
    q("#issue", p).onclick = async () => {
      const btn = q("#issue", p); btn.disabled = true; const out = q("#out", p);
      try {
        const { code, expiresAtMs } = await api.s.issueCode(staffBooth); clearInterval(codeTimer);
        out.innerHTML = `<div class="mini" style="text-align:center">${esc(boothOf(staffBooth).name)}</div><div class="bigcode">${code}</div><div class="bar"><i id="bar"></i></div><div class="mini" id="left" style="text-align:center;margin-top:6px"></div>`;
        const total = CONFIG.codeTtlSec * 1000;
        const tick = () => {
          const left = expiresAtMs - Date.now();
          if (left <= 0) { clearInterval(codeTimer); out.innerHTML = `<div class="center muted" style="padding:16px 0">코드가 만료됐어요. 다음 참가자에게는 다시 발급하세요.</div>`; btn.disabled = false; return; }
          q("#bar", out).style.width = (left / total * 100) + "%"; q("#left", out).textContent = Math.ceil(left / 1000) + "초 남음";
        };
        tick(); codeTimer = setInterval(tick, 250); setTimeout(() => { btn.disabled = false; }, 1500);
      } catch { out.innerHTML = `<div class="err">발급에 실패했어요. 네트워크와 로그인을 확인해 주세요.</div>`; btn.disabled = false; }
    };
  }

  function paneDesk(p) {
    p.innerHTML = `<div class="card"><h2>기념품 수령 확인 · 카드 찾기</h2>
      <p class="muted">참가자 화면의 복구 코드(8자리) 또는 이름으로 조회하세요.</p>
      <form id="f" class="row"><input id="qq" type="text" placeholder="코드 또는 이름" autocomplete="off" style="flex:1"><button style="width:auto" type="submit">조회</button></form>
      <div id="res" style="margin-top:14px"></div></div>`;
    q("#f", p).onsubmit = async ev => {
      ev.preventDefault(); const t = q("#qq", p).value.trim(); const res = q("#res", p); if (!t) return;
      res.innerHTML = `<div class="muted">조회 중…</div>`;
      try {
        const list = await api.s.lookup(t);
        if (!list.length) { res.innerHTML = `<div class="err">찾을 수 없어요.</div>`; return; }
        res.innerHTML = list.map(u => {
          const n = BOOTH_IDS.filter(b => u.stamps[b]).length, all = n === BOOTH_IDS.length;
          return `<div class="card" style="margin:0 0 8px"><b>${esc(u.name)}</b> <span class="mini">${u.org ? esc(u.org) + " · " : ""}코드 ${fmtCode(u.code)}</span>
            <div style="margin:6px 0">${CONFIG.booths.map(b => `<span title="${esc(b.name)}" style="font-size:22px;${u.stamps[b.id] ? "" : "filter:grayscale(1);opacity:.35"}">${b.emoji}</span>`).join(" ")} <span class="mini">${n}/${BOOTH_IDS.length}</span></div>
            ${u.claimed ? `<div class="badge" style="color:#475569">이미 수령 완료</div>` : all ? `<button data-u="${u.code}">${esc(CONFIG.prize)} 지급 완료 처리</button>` : `<div class="err" style="margin:0">아직 스탬프가 부족해요 (${BOOTH_IDS.length - n}개 남음)</div>`}</div>`;
        }).join("");
        res.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => { b.disabled = true; try { await api.s.markClaimed(b.dataset.u); q("#f", p).requestSubmit(); } catch { b.disabled = false; res.insertAdjacentHTML("beforeend", `<div class="err">처리에 실패했어요.</div>`); } });
      } catch { res.innerHTML = `<div class="err">조회에 실패했어요.</div>`; }
    };
  }

  function paneStat(p) {
    p.innerHTML = `<div class="center muted">집계 중…</div>`;
    unsubs.push(api.s.subscribeStats(s => {
      p.innerHTML = `<div class="stat"><div><b>${s.total}</b><span>카드 발급(참가자)</span></div><div><b>${s.done}</b><span>5종 완료</span></div>
        <div><b>${s.claimed}</b><span>기념품 지급</span></div><div><b>${s.done - s.claimed}</b><span>지급 대기</span></div></div>
        <div class="card" style="margin-top:12px"><h2>미션별 성공(스탬프) 수</h2><table>
        ${CONFIG.booths.map((b, i) => `<tr><td>${b.emoji} ${i + 1}. ${esc(b.name)}</td><td style="text-align:right"><b>${s.per[b.id]}</b></td></tr>`).join("")}</table>
        <p class="mini" style="margin-top:8px">이름이 ‘테스트’로 시작하는 카드는 집계에서 제외돼요.</p></div>`;
    }));
  }

  async function paneSet(p) {
    p.innerHTML = `<div class="center muted">불러오는 중…</div>`;
    let w; try { w = await api.s.getWindow(); } catch { p.innerHTML = `<div class="err">불러오지 못했어요.</div>`; return; }
    const st = winState(w), open = w.start <= Date.parse("2001-01-01") && w.end >= Date.parse("2099-01-01");
    p.innerHTML = `<div class="card"><h2>스탬프 허용 기간</h2>
      ${w.missing ? `<div class="banner bad">아직 기간이 설정되지 않았어요. 아래에서 설정해야 스탬프가 찍혀요.</div>` : ""}
      <p>${open ? "<b>제한 없음 (리허설 모드)</b>" : `<b>${kst(w.start)} ~ ${kst(w.end - 60000)}</b>`}</p>
      <p class="mini">지금은 ${st === "open" ? "스탬프를 찍을 수 있어요." : st === "before" ? "아직 시작 전이라 스탬프가 찍히지 않아요." : "기간이 끝나 스탬프가 찍히지 않아요."}</p>
      <div style="display:grid;gap:8px;margin-top:10px"><button id="a">포럼 기간으로 설정 (${esc(CONFIG.forum.label)})</button><button class="sec" id="b">리허설 모드: 기간 제한 해제</button></div>
      <p class="mini" style="margin-top:10px">리허설이 끝나면 반드시 ‘포럼 기간으로 설정’을 눌러 주세요.</p></div>`;
    q("#a", p).onclick = async () => { await api.s.setWindow(FORUM_WIN()); paneSet(p); };
    q("#b", p).onclick = async () => { await api.s.setWindow(OPEN_WIN()); paneSet(p); };
  }

  return { start(route) { cleanup(); route === "staff" ? staffView() : participantView(); }, cleanup };
}

/* ---------- 시작 (실서비스/데모 공통) ---------- */
document.body.classList.add("single");
(async () => {
  const root = document.getElementById("app");
  let api;
  try { api = CONFIG.firebase ? await makeFirebaseApi(CONFIG.firebase) : makeDemoApi(makeLocalBackend()); }
  catch (e) { root.innerHTML = `<div style="padding:40px 20px;text-align:center">연결하지 못했어요.<br><small>${esc(e.message || e)}</small></div>`; return; }
  const app = createApp(root, { api, persist: makePersist() });
  const go = () => app.start(location.hash.startsWith("#staff") ? "staff" : "p");
  addEventListener("hashchange", go); go();
})();
</script>
</body>
</html>
